name: Release

# Builds, signs, and publishes the Tauri desktop client whenever a vX.Y.Z tag is
# pushed to this remote (morion). Push the tag here specifically.
#
# Release ASSETS are published to a SEPARATE public repo (vadimmorion-commits/
# stellar-drift-releases), not this one — this source repo is private, and the
# in-app updater does a plain unauthenticated HTTPS GET to fetch latest.json;
# GitHub 404s that request for any private-repo release asset regardless of
# what's in the release, so the updater silently never found anything (first
# real release, v1.1.354, built+signed fine but the installed app's check()
# always failed quietly — no devtools in a release build to see why). The
# public releases-only repo holds nothing but built installers/signatures/
# latest.json, never the source, so this doesn't expose any code/assets.
# tauri.conf.json's plugins.updater.endpoints points at THAT repo now.
#
# Requires THREE repo secrets (Settings -> Secrets and variables -> Actions,
# on THIS repo — the workflow runs here, RELEASES_REPO_TOKEN just grants it
# write access to the other one):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# generated once via `cargo tauri signer generate` (see src-tauri README
# notes / client/IMPL_NOTES.md) — the matching public key is already embedded
# in src-tauri/tauri.conf.json.
#   RELEASES_REPO_TOKEN — fine-grained PAT scoped to ONLY
# vadimmorion-commits/stellar-drift-releases, Contents: Read and write.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Default fetch-depth is 1 (shallow) — scripts/bump_version.py needs the
          # full commit history for `git rev-list --count HEAD` to mean anything;
          # a shallow checkout made it always compute 1, shipping "1.1.1" builds.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Version = 1.1.<commit count at the tagged commit> — computed here, not hand-edited,
      # so it can never drift from the tag the way manual bumps did (stalled at 1.1.343 for
      # 8+ commits before this workflow step existed). scripts/bump_version.py patches both
      # tauri.conf.json and Cargo.toml in this ephemeral checkout only (not committed back —
      # the version is only ever displayed inside a built Tauri app, never in the repo's
      # working tree during dev, so there's nothing to keep in sync locally).
      - name: Bump version to match commit count
        run: python scripts/bump_version.py

      # No beforeBuildCommand/frontendDist build step: client/ has no bundler —
      # tauri.conf.json's build.frontendDist already points straight at the
      # plain ES-module source tree. src-tauri lives at the REPO ROOT (sibling
      # of client/, not nested inside it) — Tauri's build validator refuses to
      # bundle frontendDist if it's an ancestor of src-tauri itself (would try
      # to ship src-tauri/target as "web assets"), so projectPath is "." here.
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # PAT scoped to the target public repo, NOT the default GITHUB_TOKEN —
          # the default token is only ever valid for the repo the workflow runs
          # in, it can't create/upload to a different repo (see header comment).
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: vadimmorion-commits
          repo: stellar-drift-releases
          releaseCommitish: main
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'Stellar Drift ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
